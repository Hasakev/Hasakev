name: stats

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pinned to v2.1.0 by SHA: this step receives a repo-scoped PAT
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=Hasakev&rank_icon=percentile&custom_title=Hasakev's Stats&show=reviews,prs_merged,prs_merged_percentage,prs_commented,prs_reviewed,issues_commented&include_all_commits=true&theme=catppuccin_mocha
          path: profile/stats-dark.svg
          token: ${{ secrets.PROFILE_TOKEN }}
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=Hasakev&rank_icon=percentile&custom_title=Hasakev's Stats&show=reviews,prs_merged,prs_merged_percentage,prs_commented,prs_reviewed,issues_commented&include_all_commits=true&theme=catppuccin_latte
          path: profile/stats-light.svg
          token: ${{ secrets.PROFILE_TOKEN }}
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=Hasakev&layout=compact&langs_count=8&theme=catppuccin_mocha
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PROFILE_TOKEN }}
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=Hasakev&layout=compact&langs_count=8&theme=catppuccin_latte
          path: profile/top-langs-light.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stats cards" || exit 0
          git pull --rebase
          git push
